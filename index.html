<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container">
        <h1>Weather Prediction System</h1>
        <input role="combobox" id="searchBox" type="text" placeholder="Search by City name" autocomplete="off" autocapitalize="off" aria-autocomplete="list" aria-controls="" aria-expanded="false" value="">
        <button id="searchButton" type="submit"><i class="fa fa-search"></i></button>
    </div>

    <div class="containerTwo">
        <h2 class="message one">New Search
            <img src="./images/cloud.svg" alt="Cloud SVG" height="70px" width="70px"/>
        </h2>
        <h3 class="message two">To get started, Enter the city name!</h3>
    </div>

    <script type="text/javascript" src="./index.js" charset="utf-8"></script>
</body>
</html>
